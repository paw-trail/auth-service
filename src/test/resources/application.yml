# 테스트 전용 설정임
#
# ★이 파일은 src/main/resources/application.yml 을 덮어쓰는 것이 아니라 통째로 가림
#   클래스패스에서 application.yml 을 하나만 찾는데
#   Gradle 테스트에서는 build/resources/test 가 앞서기 때문임
#   따라서 main 쪽에 있던 값도 여기 필요하면 다시 적어야 함
#   main 에 있는 세 줄 중 spring.application.name 과 spring.profiles.default 를 다시 적었고
#   spring.config.import 는 아래에서 설정 서버를 끄므로 적지 않음
#
# ★아래 값 중 넷은 config 저장소 1계층(application.yml)의 사본임
#   테스트에서는 설정 서버를 끄므로 1계층 값이 하나도 내려오지 않기 때문임
#   config 저장소에서 그 값을 바꾸면 여기도 함께 봐야 함

spring:
  application:
    # 가려진 main 쪽 값을 다시 적은 것임
    # 없으면 로그의 appName 과 유레카 등록 이름이 unknown 이 됨
    name: auth-service

  profiles:
    # 가려진 main 쪽 값을 다시 적은 것임
    # logback-spring.xml 이 이 값으로 갈림
    #   local 이면 콘솔만, local 이 아니면 Loki appender 가 붙음
    # 없으면 프로파일이 default 가 되어 테스트가 Loki 로 로그를 밀어 보내려 하고
    # 로컬에 Loki 가 없으면 ConnectException 스택트레이스가 로그를 뒤덮음
    default: local

  cloud:
    config:
      # 테스트가 설정 서버 기동 여부에 따라 갈리면 안 되므로 끔
      # main 쪽 import 에 optional 이 붙어 있어 꺼도 기동은 정상임
      enabled: false

  jpa:
    hibernate:
      # config 1계층의 사본임
      # 없으면 기본값이 none 이라 엔티티와 스키마가 어긋나도 검사를 통과함
      # 테스트를 실제 PostgreSQL 로 도는 컨테이너에 붙이는 가장 큰 이유가 이 검증임
      ddl-auto: validate

  flyway:
    # config 1계층의 사본임
    # 두 경로가 형제여야 함, db/migration 하나로 두면 상위 경로라 하위가 버려짐
    # 여기가 없으면 기본값 classpath:db/migration 으로 떨어져 운영과 다른 경로로 검증됨
    locations: classpath:db/migration/common,classpath:db/migration/service

eureka:
  client:
    # 테스트는 서비스 디스커버리에 참여하지 않음
    # 켜 두면 등록을 시도하다 실패해 로그가 뒤덮임
    enabled: false

# ── 아래는 테스트에서만 쓰는 값임 ─────────────────────────────
#
# 설정 서버를 껐으므로 config 저장소의 auth-service.yml 이 내려오지 않음
# 그런데 JwtProperties 와 AuthProperties 가 값이 비면 기동을 막게 되어 있어
# 여기에 없으면 contextLoads 가 그 검증에 걸려 실패함
#
# 검증을 끄지 않고 값을 채우는 쪽을 택한 이유는
# 그래야 이 테스트가 JwtEncoder 생성까지 실제로 확인하기 때문임
# 값을 안 주고 자동설정을 제외하면 검증 범위가 절반으로 줄어듦

app:
  jwt:
    # 테스트 전용으로 따로 만든 키임 (pawtrail-test-keys)
    # 이 키로 만든 토큰을 받아 주는 서버가 없으므로 공개되어도 무해함
    # 실제 서명 키는 환경변수로만 들어오며 이 저장소에 없음
    private-key-b64: 
    issuer: pawtrail-auth-test
    access-expiry: 30m
    refresh-expiry: 14d
    claim:
      account-id: sub
      role: role

  auth:
    # 실제 목록과 같을 필요는 없음
    # 비어 있지만 않으면 되고, 경로 규칙이 맞는지는 이 테스트가 볼 수 있는 것이 아님
    permit-all:
      - /api/v1/auth/login
    cookie:
      secure: false
      domain: ""
      refresh-path: /api/v1/auth
